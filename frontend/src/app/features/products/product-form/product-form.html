
<div class="form-card">

  <h2>Thêm sản phẩm</h2>
  <p>Nhập thông tin sản phẩm mới</p>

  <form (ngSubmit)="submitForm()">

    <label for="sku">Mã sản phẩm (SKU)</label>
    <input
      id="sku"
      name="sku"
      [(ngModel)]="sku"
      placeholder="Ví dụ: SP007"
      required
    />

    <label for="name">Tên sản phẩm</label>
    <input
      id="name"
      name="name"
      [(ngModel)]="name"
      placeholder="Nhập tên sản phẩm"
      required
    />

    <label for="category">Danh mục</label>
    <select
      id="category"
      name="category"
      [(ngModel)]="category"
    >
      <option *ngFor="let item of categories" [value]="item">
        {{ item }}
      </option>
    </select>

    <label for="price">Giá sản phẩm</label>
    <input
      id="price"
      name="price"
      type="number"
      min="1"
      [(ngModel)]="price"
      required
    />

    <label for="stock">Số lượng tồn kho</label>
    <input
      id="stock"
      name="stock"
      type="number"
      min="0"
      [(ngModel)]="stock"
      required
    />

    <div class="form-actions">
      <button
        type="button"
        class="cancel-button"
        (click)="cancel.emit()"
      >
        Hủy
      </button>

      <button type="submit" class="save-button">
        Thêm sản phẩm
      </button>
    </div>

  </form>

</div>
